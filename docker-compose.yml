# =============================================================================
# Shared Infrastructure — All Environments
# =============================================================================
# One compose for local dev, DigitalOcean, and AWS.
# Differences live in .env — see .env.example.localhost and .env.example.do.
#
# Usage:
#   docker compose up -d                        # Start (reads .env)
#   docker compose --profile local up -d        # Start with Mailpit (local)
#   docker compose down                         # Stop (NEVER use -v)
#
# Projects connect via the 'infra' Docker network.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Traefik - Reverse Proxy
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    container_name: traefik
    restart: always
    command:
      - --api.dashboard=true
      - --api.insecure=${TRAEFIK_INSECURE:-false}
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Trust XFF/CF-Connecting-IP from Cloudflare (origin is behind CF proxy)
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${TRUSTED_PROXY_IPS:-127.0.0.1/32}
      - --entrypoints.web.forwardedHeaders.trustedIPs=${TRUSTED_PROXY_IPS:-127.0.0.1/32}
      # Redirect all plain HTTP to HTTPS (ACME http-01 challenge path is exempted by Traefik)
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=infra
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # HTTP-01 resolver (legacy, kept for transition — remove once all certs are DNS-01)
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-noop@localhost}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # DNS-01 resolver via Cloudflare (primary — works behind CF proxy)
      - --certificatesresolvers.letsencrypt-dns.acme.email=${ACME_EMAIL:-noop@localhost}
      - --certificatesresolvers.letsencrypt-dns.acme.storage=/letsencrypt/acme-dns.json
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --log.level=INFO
      - --ping=true
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:80:80"
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
      - "${TRAEFIK_DASHBOARD_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - infra
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL - Shared Database
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_BIND:-0.0.0.0}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis - Shared Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis
    restart: always
    command: redis-server ${REDIS_ARGS:---save 60 1}
    ports:
      - "${REDIS_BIND:-0.0.0.0}:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_HEALTHCHECK_ARGS} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Langfuse v3 - LLM Observability
  # ---------------------------------------------------------------------------
  # v3 splits the v2 single-container design into web + worker, and adds
  # ClickHouse (trace storage), MinIO (event/media blobs). Redis is reused
  # from the shared service above (no auth — LANGFUSE_REDIS_* points at it).
  #
  # Upgrading v2 → v3: use image tag `3.29.0` for the first boot so the
  # Postgres → ClickHouse backfill runs on a version that still knows the
  # v2 schema. After the backfill completes, bump to `:3` (latest).
  # ---------------------------------------------------------------------------
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    container_name: umami
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/umami
      - APP_SECRET=${UMAMI_SECRET:-local-umami-secret-dev-only}
      - DISABLE_TELEMETRY=1
    ports:
      - "${UMAMI_BIND:-0.0.0.0}:3040:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra
    labels:
      - "traefik.enable=${UMAMI_TRAEFIK:-false}"
      - "traefik.http.routers.umami.rule=Host(`${UMAMI_DOMAIN:-analytics.localhost}`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls=${UMAMI_TLS:-true}"
      - "traefik.http.routers.umami.tls.certresolver=${UMAMI_CERTRESOLVER:-}"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Vaultwarden - Password Manager (self-hosted Bitwarden-compatible)
  # ---------------------------------------------------------------------------
  # Data lives in the ${VAULTWARDEN_VOLUME} volume — set explicitly when
  # migrating an existing install so history is preserved.
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    profiles: [vaultwarden]
    environment:
      DOMAIN: "${VAULTWARDEN_DOMAIN:-https://vault.localhost}"
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS:-false}"
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN:-}"
    volumes:
      - vaultwarden_data:/data
    networks:
      - infra
    labels:
      - "traefik.enable=${VAULTWARDEN_TRAEFIK:-false}"
      - "traefik.docker.network=infra"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_HOST:-vault.localhost}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=${VAULTWARDEN_TLS:-true}"
      - "traefik.http.routers.vaultwarden.tls.certresolver=${VAULTWARDEN_CERTRESOLVER:-}"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Mailpit - Email Catcher (local dev only)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: always
    profiles: [local]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.localhost`) || Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: always
    ports:
      - "${NEO4J_BIND:-127.0.0.1}:7687:7687"
      - "${NEO4J_BIND:-127.0.0.1}:7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j-local-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Dedicated, ephemeral Neo4j for TheBrain's integration tests. Kept separate
  # from the dev graph (above) so restored production data can live there
  # without breaking tests that assume a clean graph. tmpfs `/data` means it
  # starts empty on every (re)start; TheBrain's global-setup wipes + migrates
  # it once per `npm test` run. Bolt on :7688 (tests point NEO4J_URI here).
  neo4j-test:
    image: neo4j:5-community
    container_name: neo4j-test
    restart: unless-stopped
    ports:
      - "${NEO4J_BIND:-127.0.0.1}:7688:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j-local-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    tmpfs:
      - /data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Tika + Docling - Shared document text-extraction services
  # ---------------------------------------------------------------------------
  # Platform-shared, stateless extractors. Owned here (not by any app) so any
  # project — Librarian (in-Docker, via service name) and host-run apps like
  # Caitie (via the published host port) — can reach them. Versions are pinned
  # by digest so consumers stay stable.
  #
  # Reach them:
  #   - In-Docker (same `infra` network):  http://tika:9998   /  http://docling:5001
  #   - Host-run apps:                      http://localhost:9998 / http://localhost:5001
  #
  # `profiles: [local]` keeps these on the local-dev stack only. Prod infra
  # (`deploy.sh` runs a bare `docker compose up -d`, no profile) does NOT start
  # them — Librarian's own docker-compose.zora.yml ships its own extractors
  # there, so this avoids duplicate Java/OCR containers OOMing a small droplet.
  tika:
    image: apache/tika:latest-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
    container_name: tika
    restart: unless-stopped
    profiles: [local]
    ports:
      - "9998:9998"
    networks:
      - infra
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docling:
    image: quay.io/docling-project/docling-serve:latest@sha256:bdf706b8ac87e5f5a13b5dec1cbc42b214cf2ece4e9281098524189cdb08af51
    container_name: docling
    restart: unless-stopped
    profiles: [local]
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "5001:5001"
      # docling-serve also EXPOSEs 8080; host 8080 is taken by Traefik's
      # dashboard, so publish it on 8082 instead. (The API + health live on 5001.)
      - "8082:8080"
    networks:
      - infra
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  infra:
    name: infra
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-redis_data}
  traefik_letsencrypt:
    name: ${TRAEFIK_VOLUME:-traefik_letsencrypt}
  vaultwarden_data:
    name: ${VAULTWARDEN_VOLUME:-vaultwarden_data}
  neo4j_data:
    name: ${NEO4J_VOLUME:-neo4j_data}
  neo4j_logs:
    name: ${NEO4J_LOGS_VOLUME:-neo4j_logs}
