# =============================================================================
# Shared Infrastructure — All Environments
# =============================================================================
# One compose for local dev, DigitalOcean, and AWS.
# Differences live in .env — see .env.example.localhost and .env.example.do.
#
# Usage:
#   docker compose up -d                        # Start (reads .env)
#   docker compose --profile local up -d        # Start with Mailpit (local)
#   docker compose down                         # Stop (NEVER use -v)
#
# Projects connect via the 'infra' Docker network.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Traefik - Reverse Proxy
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    container_name: traefik
    restart: always
    command:
      - --api.dashboard=true
      - --api.insecure=${TRAEFIK_INSECURE:-false}
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Trust XFF/CF-Connecting-IP from Cloudflare (origin is behind CF proxy)
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${TRUSTED_PROXY_IPS:-127.0.0.1/32}
      - --entrypoints.web.forwardedHeaders.trustedIPs=${TRUSTED_PROXY_IPS:-127.0.0.1/32}
      # Redirect all plain HTTP to HTTPS (ACME http-01 challenge path is exempted by Traefik)
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=infra
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # HTTP-01 resolver (legacy, kept for transition — remove once all certs are DNS-01)
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-noop@localhost}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # DNS-01 resolver via Cloudflare (primary — works behind CF proxy)
      - --certificatesresolvers.letsencrypt-dns.acme.email=${ACME_EMAIL:-noop@localhost}
      - --certificatesresolvers.letsencrypt-dns.acme.storage=/letsencrypt/acme-dns.json
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --log.level=INFO
      - --ping=true
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:80:80"
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
      - "${TRAEFIK_DASHBOARD_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - infra
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL - Shared Database
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_BIND:-0.0.0.0}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis - Shared Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis
    restart: always
    command: redis-server ${REDIS_ARGS:---save 60 1}
    ports:
      - "${REDIS_BIND:-0.0.0.0}:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_HEALTHCHECK_ARGS} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Phoenix - LLM Observability (THE standard across all hosts)
  # ---------------------------------------------------------------------------
  # One container against the shared postgres. No ClickHouse, no object store,
  # no queue. This is the deliberate common denominator: the same stack runs on
  # local, zora, and aws01, so there is one thing to learn, one thing to debug,
  # and no host where it "doesn't quite fit".
  #
  # Chosen over Langfuse v4 on measured footprint (2026-08-06, same machine,
  # same OTLP payloads):
  #   Langfuse v4 (tuned)   1848 MiB, 4 containers, +ClickHouse +MinIO +Redis
  #   Phoenix                ~400 MiB, 1 container,  +Postgres (already running)
  # Phoenix ingested 500 spans under a 1g cap at 411 MiB, no OOM, no restarts.
  # On aws01 (7.5 GiB shared with ~1.4 GiB of IT agents) that is ~42% of the box
  # versus ~61%. The Langfuse services below are kept but no longer the default.
  #
  # Feature parity is closer than the "lightweight alternative" framing suggests.
  # Verified against the live schema on 2026-08-06, NOT from docs:
  #   - Model price catalog: 268 models / 797 token prices, with separate
  #     input, output, cache_read and cache_write rates. Current enough to know
  #     claude-opus-5, claude-sonnet-5, gpt-5 and gpt-5.4 — i.e. it covers the
  #     exact gap that forced the Langfuse v2->v3 migration in April.
  #   - Prompt management: prompts, prompt_versions, prompt_version_tags,
  #     prompt_labels. Versioning and labels, same shape as Langfuse's.
  #   - Datasets, experiments and evaluators are all present too.
  #
  # The one real difference: Phoenix is Elastic License 2.0, not MIT. No
  # practical constraint for internal use, but it is not OSI open source.
  #
  # First-boot prerequisite, once per host:
  #   docker exec postgres createdb -U postgres phoenix
  # Phoenix creates its own schema, but not the database.
  #
  # Start with:  docker compose --profile phoenix up -d
  # ---------------------------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:19.18.0@sha256:65211b52795a0f8b67e29ec1a0787d4b683acb3c5450d2c30a30e0ad670bd3a8
    container_name: phoenix
    restart: always
    profiles: [phoenix]
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/phoenix
      # Auth is ON by default here. Phoenix ships it OFF, which leaves the UI
      # and the whole API open to anything that can reach the container.
      # /healthz stays unauthenticated so the healthcheck below still works.
      - PHOENIX_ENABLE_AUTH=${PHOENIX_ENABLE_AUTH:-True}
      - PHOENIX_SECRET=${PHOENIX_SECRET:-}
      # Bearer token for instrumentation/API. Must be >=32 chars, contain a
      # digit and a lowercase letter, and DIFFER from PHOENIX_SECRET.
      - PHOENIX_ADMIN_SECRET=${PHOENIX_ADMIN_SECRET:-}
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${PHOENIX_ADMIN_PASSWORD:-}
      - PHOENIX_ENABLE_STRONG_PASSWORD_POLICY=${PHOENIX_STRONG_PASSWORDS:-True}
      # Upstream default is 0 = keep forever. Spans are the fastest-growing
      # table and nothing else prunes them.
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=${PHOENIX_RETENTION_DAYS:-90}
      - PHOENIX_WORKING_DIR=/data
    ports:
      # UI + OTLP/HTTP. Loopback by default — on a server reach it with
      #   ssh -L 6006:localhost:6006 <host>
      - "${PHOENIX_BIND:-127.0.0.1}:6006:6006"
      # OTLP/gRPC. Also loopback: in-container senders use http://phoenix:6006
      # or phoenix:4317 over the infra network and never touch these.
      - "${PHOENIX_BIND:-127.0.0.1}:4317:4317"
    volumes:
      - phoenix_data:/data
    # Measured 411 MiB resident after 500 spans under this exact cap.
    mem_limit: ${PHOENIX_MEM:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra
    labels:
      - "traefik.enable=${PHOENIX_TRAEFIK:-false}"
      - "traefik.docker.network=infra"
      - "traefik.http.routers.phoenix.rule=Host(`${PHOENIX_DOMAIN:-phoenix.localhost}`)"
      - "traefik.http.routers.phoenix.entrypoints=websecure"
      - "traefik.http.routers.phoenix.tls=${PHOENIX_TLS:-true}"
      # No certresolver label — an empty one silently invalidates the router
      # (bare 404, nothing in the traefik log). See the langfuse notes below.
      - "traefik.http.services.phoenix.loadbalancer.server.port=6006"
    healthcheck:
      # The image is DISTROLESS — no sh, no wget, no curl. A CMD-SHELL probe
      # fails with "executable not found" and the container never goes healthy,
      # which also means traefik never publishes a router for it. Only the exec
      # form works, and python is the one interpreter present.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Langfuse v4 - LLM Observability (SUPERSEDED by phoenix above)
  # ---------------------------------------------------------------------------
  # Kept, working and tested, but no longer the default on any host — running a
  # different observability stack per host was the thing we were trying to stop
  # doing. Phoenix covers cost tracking and prompt management too (see above),
  # so there is no longer a standing feature reason to enable this. Kept as a
  # tested fallback: MIT-licensed, and the mature choice at high trace volume
  # where Postgres-backed span storage would stop keeping up. Expect ~1.85 GiB
  # across four containers plus ClickHouse, MinIO and Redis.
  #
  # Four services: langfuse-web + langfuse-worker (the app), clickhouse (traces,
  # observations, scores) and minio (event/media blobs). Postgres (users, orgs,
  # projects, prompts, API keys) and Redis (queue + cache) are reused from the
  # shared services above rather than duplicated.
  #
  # ALL FOUR are gated behind `profiles: [langfuse]` — this stack is NOT wanted
  # on every host. Start it explicitly with:
  #   docker compose --profile langfuse up -d
  # (Session 15/16, 2026-04-20: an uncapped Langfuse on a 4 GiB host cascaded a
  # single OOM kill into a full-host livelock. The caps below are not optional.)
  #
  # Footprint, measured 2026-08-06, one project, no real traffic. Note these
  # are cgroup peaks, not a single idle sample — the idle sample understates it:
  #   web       ~1.0 GiB resident, ~1.6 GiB peak (Next.js boot spike)
  #   worker    ~0.5 GiB resident, ~0.6 GiB peak
  #   clickhouse — see below; it fills to whatever cap you give it
  #   minio     ~0.1 GiB
  #
  # IMPORTANT: ClickHouse's mem_limit behaves as a RESERVATION, not a ceiling.
  # It reads the cgroup limit and sets max_server_memory_usage to 0.9x it, then
  # fills mark/uncompressed caches until it gets there and stays. Measured: it
  # sat at 883/896 MiB with a 896m cap and climbed to ~1.03 GiB (heading to its
  # 1.35 GiB self-limit) with a 1536m cap. Budget for it accordingly — on a
  # tight host, LOWER this cap rather than expecting ClickHouse to idle low.
  #
  # Whole stack: ~2.5 GiB resident / ~2.9 GiB peak with the small caps below;
  # ~3.0 / ~3.4 GiB at the defaults. Per-host tuning via the LANGFUSE_*_MEM
  # vars — see .env.example.
  #
  # First-boot prerequisite: the `langfuse` database must already exist —
  # Prisma runs the migrations but will not CREATE DATABASE. Once, per host:
  #   docker exec postgres createdb -U postgres langfuse
  # Without it langfuse-web crash-loops on `database "langfuse" does not exist`.
  #
  # v4 requires ClickHouse >= 25.12, Postgres >= 15, Redis >= 7.0 — all met by
  # the pins here and by the shared postgres/redis above. v4's default ingestion
  # write mode (`events_only`) REJECTS Python SDK <=v2 and JS/TS SDK <=v3, so
  # bump the SDK in any project before pointing it at this.
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    container_name: langfuse-web
    restart: always
    profiles: [langfuse]
    environment:
      # --- Postgres (transactional: users, orgs, projects, prompts, API keys) ---
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      # --- Auth / crypto ---
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET:-local-langfuse-secret-dev-only}
      - NEXTAUTH_URL=${LANGFUSE_URL:-https://langfuse.localhost}
      - SALT=${LANGFUSE_SALT:-local-langfuse-salt-dev-only}
      # Encrypts integration credentials at rest. Rotating it invalidates every
      # encrypted row — generate once per environment and keep it stable.
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-}
      - TELEMETRY_ENABLED=false
      # Pin V8's old-space ceiling instead of letting Node derive it from
      # mem_limit. Auto-derivation is what made this container unfixable-by-
      # observation under v3: raise the cap, V8 raises the heap, it fills the
      # heap, it dies again one notch higher. Explicit heap + a cap ~25% above
      # it makes both numbers mean something.
      - NODE_OPTIONS=--max-old-space-size=${LANGFUSE_WEB_HEAP_MB:-1024}
      # --- ClickHouse (traces, observations, scores) ---
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      # --- Redis (ingestion queue + cache) — shared redis service ---
      # BullMQ requires maxmemory-policy=noeviction (Redis' default; do not set
      # an eviction policy in REDIS_ARGS or queued events get dropped silently).
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:-}
      # --- S3 / MinIO (event + media uploads) ---
      # Media endpoint is the in-network address, so browser-side direct media
      # upload is unavailable. Traces/observations are unaffected. To enable it,
      # expose MinIO and point LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT at that URL.
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      # --- First-boot seeding (local dev only — ignored after the first start) ---
      - LANGFUSE_INIT_ORG_ID
      - LANGFUSE_INIT_ORG_NAME
      - LANGFUSE_INIT_PROJECT_ID
      - LANGFUSE_INIT_PROJECT_NAME
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      - LANGFUSE_INIT_PROJECT_SECRET_KEY
      - LANGFUSE_INIT_USER_EMAIL
      - LANGFUSE_INIT_USER_NAME
      - LANGFUSE_INIT_USER_PASSWORD
    ports:
      - "${LANGFUSE_BIND:-127.0.0.1}:3030:3000"
    # 2560m = the 2048m V8 heap above + ~500m for native/buffers/non-heap.
    # v4 needs materially more than v3 did here: 1536m (the v3 fix) still
    # crash-looped, dying at a 756 MB heap. Verified 2026-08-06.
    mem_limit: ${LANGFUSE_WEB_MEM:-1536m}
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      infra:
        # Apps reach Langfuse at http://langfuse:3000 on the infra network.
        aliases:
          - langfuse
    labels:
      - "traefik.enable=${LANGFUSE_TRAEFIK:-false}"
      - "traefik.docker.network=infra"
      - "traefik.http.routers.langfuse.rule=Host(`${LANGFUSE_DOMAIN:-langfuse.localhost}`)"
      - "traefik.http.routers.langfuse.entrypoints=websecure"
      - "traefik.http.routers.langfuse.tls=${LANGFUSE_TLS:-true}"
      # No certresolver label on purpose. An empty `certresolver=` silently
      # invalidates the whole router (traefik drops it — the symptom is a bare
      # 404 with nothing in the traefik log), and locally the cert comes from
      # the mkcert file in dynamic/tls.yml, not from ACME. On a server, add the
      # resolver in dynamic/routing-langfuse.yml the way the other prod
      # services do, rather than reintroducing a conditionally-empty label.
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"
    healthcheck:
      # $$HOSTNAME, not localhost: Next.js 16 binds the server to the container
      # hostname, so 127.0.0.1:3000 inside the container is connection-refused
      # even while the app is serving fine on the published port.
      test: ["CMD-SHELL", "wget -q -O- http://$$HOSTNAME:3000/api/public/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langfuse-worker:
    image: langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    container_name: langfuse-worker
    restart: always
    profiles: [langfuse]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      - SALT=${LANGFUSE_SALT:-local-langfuse-salt-dev-only}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-}
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:-}
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
    # 2g. 512m was enough for the v3 worker but NOT the v4 one: it finishes its
    # migrations and evaluator/dashboard seeding, then dies with "Ineffective
    # mark-compacts near heap limit" at a ~248 MB heap — V8 derives its old-space
    # ceiling from the cgroup limit, so a 512m cap yields a ~256 MB heap. Verified
    # by crash-loop on 2026-08-06 (exit 134/SIGABRT). Measured steady state after
    # the fix is ~1.1 GiB, which is why this is 2g and not 1536m.
    mem_limit: ${LANGFUSE_WORKER_MEM:-896m}
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infra
    labels: ["traefik.enable=false"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # v4 needs >= 25.12 for lightweight updates, the JSON type and full-text
  # search. 25.12 is what upstream's own compose ships and tests against the
  # :4 images; 26.4 is the docs' "recommended" and the next step up.
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    container_name: langfuse-clickhouse
    restart: always
    profiles: [langfuse]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Bounds ClickHouse's internal caches. Without this its mem_limit acts as
      # a reservation, not a cap — see the file's header for why.
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ports:
      - "${CLICKHOUSE_BIND:-127.0.0.1}:8123:8123"
    # 1536m, up from the 512m coarse backstop used under v3 — v4 leans on
    # ClickHouse harder (full-text search, JSON type). Measured ~600 MiB at idle
    # with a single project. If you see ClickHouse OOMKilled, tune
    # max_server_memory_usage rather than only raising this.
    mem_limit: ${LANGFUSE_CLICKHOUSE_MEM:-896m}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - infra
    labels: ["traefik.enable=false"]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langfuse-minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: langfuse-minio
    restart: always
    profiles: [langfuse]
    entrypoint: sh
    # Create the 'langfuse' bucket before starting the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      # Console. Loopback-only by default; set MINIO_BIND=0.0.0.0 to browse it.
      - "${MINIO_BIND:-127.0.0.1}:9091:9001"
    volumes:
      - minio_data:/data
    # Measured ~77 MiB serving Langfuse's event/media blobs.
    mem_limit: ${LANGFUSE_MINIO_MEM:-256m}
    networks:
      - infra
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    container_name: umami
    restart: always
    # Disabled by default — needs an `umami` database in postgres before it
    # will boot (else it crash-loops on `database "umami" does not exist`).
    # Start explicitly with: docker compose --profile umami up -d
    profiles: [umami]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/umami
      - APP_SECRET=${UMAMI_SECRET:-local-umami-secret-dev-only}
      - DISABLE_TELEMETRY=1
    ports:
      - "${UMAMI_BIND:-0.0.0.0}:3040:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra
    labels:
      - "traefik.enable=${UMAMI_TRAEFIK:-false}"
      - "traefik.http.routers.umami.rule=Host(`${UMAMI_DOMAIN:-analytics.localhost}`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls=${UMAMI_TLS:-true}"
      - "traefik.http.routers.umami.tls.certresolver=${UMAMI_CERTRESOLVER:-}"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Vaultwarden - Password Manager (self-hosted Bitwarden-compatible)
  # ---------------------------------------------------------------------------
  # Data lives in the ${VAULTWARDEN_VOLUME} volume — set explicitly when
  # migrating an existing install so history is preserved.
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    profiles: [vaultwarden]
    environment:
      DOMAIN: "${VAULTWARDEN_DOMAIN:-https://vault.localhost}"
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS:-false}"
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN:-}"
    volumes:
      - vaultwarden_data:/data
    networks:
      - infra
    labels:
      - "traefik.enable=${VAULTWARDEN_TRAEFIK:-false}"
      - "traefik.docker.network=infra"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_HOST:-vault.localhost}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=${VAULTWARDEN_TLS:-true}"
      - "traefik.http.routers.vaultwarden.tls.certresolver=${VAULTWARDEN_CERTRESOLVER:-}"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Mailpit - Email Catcher (local dev only)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: always
    profiles: [local]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.localhost`) || Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: always
    ports:
      - "${NEO4J_BIND:-127.0.0.1}:7687:7687"
      - "${NEO4J_BIND:-127.0.0.1}:7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j-local-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Dedicated, ephemeral Neo4j for TheBrain's integration tests. Kept separate
  # from the dev graph (above) so restored production data can live there
  # without breaking tests that assume a clean graph. tmpfs `/data` means it
  # starts empty on every (re)start; TheBrain's global-setup wipes + migrates
  # it once per `npm test` run. Bolt on :7688 (tests point NEO4J_URI here).
  neo4j-test:
    image: neo4j:5-community
    container_name: neo4j-test
    restart: unless-stopped
    # Test-only: TheBrain's integration suite points NEO4J_URI here. Gated to
    # the `local` profile (COMPOSE_PROFILES=local on dev, empty on prod) so the
    # bare `docker compose up -d` that deploy.sh runs on prod does NOT start it.
    profiles: [local]
    ports:
      - "${NEO4J_BIND:-127.0.0.1}:7688:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j-local-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    tmpfs:
      - /data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Tika + Docling - Shared document text-extraction services
  # ---------------------------------------------------------------------------
  # Platform-shared, stateless extractors. Owned here (not by any app) so any
  # project — Librarian (in-Docker, via service name) and host-run apps like
  # Caitie (via the published host port) — can reach them. Versions are pinned
  # by digest so consumers stay stable.
  #
  # Reach them:
  #   - In-Docker (same `infra` network):  http://tika:9998   /  http://docling:5001
  #   - Host-run apps:                      http://localhost:9998 / http://localhost:5001
  #
  # Shared on BOTH local and prod (no profile): apps reach them by service
  # name instead of each shipping its own Java/OCR containers. The prod host
  # has ample RAM (15Gi), so one shared set is the lighter footprint; consuming
  # apps (e.g. Librarian) drop their own extractors and point DOCLING_URL/
  # TIKA_URL at these. `deploy.sh` on prod runs a bare `docker compose up -d`
  # (no profile), so leaving these profile-less is what starts them there.
  tika:
    image: apache/tika:latest-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
    container_name: tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    networks:
      - infra
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docling:
    image: quay.io/docling-project/docling-serve:latest@sha256:bdf706b8ac87e5f5a13b5dec1cbc42b214cf2ece4e9281098524189cdb08af51
    container_name: docling
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "5001:5001"
      # docling-serve also EXPOSEs 8080; host 8080 is taken by Traefik's
      # dashboard, so publish it on 8082 instead. (The API + health live on 5001.)
      - "8082:8080"
    networks:
      - infra
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  infra:
    name: infra
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-redis_data}
  traefik_letsencrypt:
    name: ${TRAEFIK_VOLUME:-traefik_letsencrypt}
  vaultwarden_data:
    name: ${VAULTWARDEN_VOLUME:-vaultwarden_data}
  neo4j_data:
    name: ${NEO4J_VOLUME:-neo4j_data}
  neo4j_logs:
    name: ${NEO4J_LOGS_VOLUME:-neo4j_logs}
  clickhouse_data:
    name: ${CLICKHOUSE_VOLUME:-langfuse_clickhouse_data}
  clickhouse_logs:
    name: ${CLICKHOUSE_LOGS_VOLUME:-langfuse_clickhouse_logs}
  minio_data:
    name: ${MINIO_VOLUME:-langfuse_minio_data}
  phoenix_data:
    name: ${PHOENIX_VOLUME:-phoenix_data}
